<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="-apple-system, 'Hiragino Sans', sans-serif">
  <rect width="720" height="220" fill="#ffffff"/>
  <g stroke="#8250df" stroke-width="1.5" fill="#faf7ff">
    <rect x="24" y="60" width="180" height="100" rx="10"/>
  </g>
  <text x="114" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">GitHub</text>
  <text x="114" y="122" text-anchor="middle" font-size="12" fill="#59636e">blob ページ</text>
  <text x="114" y="140" text-anchor="middle" font-size="12" fill="#59636e">.html / .htm</text>

  <g stroke="#0969da" stroke-width="1.5" fill="#f2f8ff">
    <rect x="270" y="60" width="180" height="100" rx="10"/>
  </g>
  <text x="360" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">拡張機能</text>
  <text x="360" y="122" text-anchor="middle" font-size="12" fill="#59636e">CSS・画像を取得し</text>
  <text x="360" y="140" text-anchor="middle" font-size="12" fill="#59636e">data: URI に埋め込む</text>

  <g stroke="#1a7f37" stroke-width="1.5" fill="#f2fbf5">
    <rect x="516" y="60" width="180" height="100" rx="10"/>
  </g>
  <text x="606" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">プレビュー</text>
  <text x="606" y="122" text-anchor="middle" font-size="12" fill="#59636e">sandbox iframe</text>
  <text x="606" y="140" text-anchor="middle" font-size="12" fill="#59636e">JavaScript 無効</text>

  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M212 110 H262"/>
    <path d="M458 110 H508"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <text x="360" y="34" text-anchor="middle" font-size="13" fill="#59636e">すべて端末内で完結し、第三者のサービスは経由しない</text>
</svg>
